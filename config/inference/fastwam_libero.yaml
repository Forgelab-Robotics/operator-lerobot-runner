# FastWAM LIBERO 双相机单次推理配置。
#
#   HF_HUB_OFFLINE=1 uv run lerobot infer-once \
#     --config config/inference/fastwam_libero.yaml --height 224 --width 224
#
# 下面的 state/action 名称仅用于 runner 冒烟。接入 PaOS 真机前，必须按训练数据
# 确认并替换名称、语义、单位与顺序；checkpoint 本身只能提供维度，不能提供关节名。

joints:
  - { name: action_0, mode: position, unit: normalized }
  - { name: action_1, mode: position, unit: normalized }
  - { name: action_2, mode: position, unit: normalized }
  - { name: action_3, mode: position, unit: normalized }
  - { name: action_4, mode: position, unit: normalized }
  - { name: action_5, mode: position, unit: normalized }
  - { name: gripper, mode: position, unit: normalized }

state_joints:
  - state_0
  - state_1
  - state_2
  - state_3
  - state_4
  - state_5
  - state_6
  - state_7

policy:
  type: fastwam
  auto_start: false
  policy_id: fastwam_libero_once

  pretrained_path: ../../checkpoints/fastwam_libero_uncond_2cam224
  wan_diffusers_path: ../../checkpoints/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers/snapshots/b8fff7315c768468a5333511427288870b2e9635
  tokenizer_path: ../../checkpoints/fastwam_runtime/google/umt5-xxl

  # 应替换为当前 LIBERO task 在训练数据中的原始文本。
  instruction: pick up the object and place it at the target location

  device: cuda:0
  torch_dtype: bfloat16
  use_amp: false
  n_action_steps: 10
  num_inference_steps: 10
  inference_seed: 42
  rand_device: cpu
  text_cfg_scale: 1.0
  negative_prompt: ""
  sigma_shift: null
  tiled: false

# FastWAM 按 feature 名排序后沿宽度拼接两路图像；两路都不可缺失或增加。
image_inputs:
  image/camera_0: image
  image/camera_1: image2
