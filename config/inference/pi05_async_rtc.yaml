# PI0.5 异步 Real-Time Chunking 推理配置模板
#
#   uv run lerobot infer --config config/inference/pi05_async_rtc.yaml
# 非阻塞 backend 会在后台执行 predict_action_chunk()，控制线程消费 RTC action queue。

joints:
  - { name: joint1, mode: position, unit: radians }
  - { name: joint2, mode: position, unit: radians }
  - { name: joint3, mode: position, unit: radians }
  - { name: joint4, mode: position, unit: radians }
  - { name: joint5, mode: position, unit: radians }
  - { name: joint6, mode: position, unit: radians }
  - { name: gripper, mode: position, unit: millimeters }

# 可选：当 observation.state 与动作 joints 的维度或顺序不同时单独配置。
# state_joints: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]

policy:
  type: pi05
  auto_start: false
  policy_id: pi05_async_rtc_example

  pretrained_path: /path/to/pi05/pretrained_model
  tokenizer_path: /path/to/local/paligemma-tokenizer
  instruction: pick up the object and place it in the target

  inference_mode: async_rtc
  # async_rtc 不支持 compile_model=true；训练期 gradient checkpointing 也应关闭。
  compile_model: false
  gradient_checkpointing: false
  control_hz: 50
  rtc:
    execution_horizon: 10
    queue_threshold: 30
    max_guidance_weight: 10.0
    prefix_attention_schedule: LINEAR

# alias 必须与 checkpoint 的 observation.images.<alias> feature 完全一致。
image_inputs:
  image/top: top
  image/angle: angle
  image/left_pillar: left_pillar
