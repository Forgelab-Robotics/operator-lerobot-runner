# 推理配置模板（对标 pick_and_place / examples/dora_infer_act_*）
#
#   uv run lerobot infer-once --config config/inference/example.yaml
#   uv run lerobot infer --config config/inference/example.yaml
# 真机请优先改用 examples/dora_infer_act_7d/policy_act.yaml 等完整样例。

joints:
  - name: joint1
    mode: position
    unit: radians
  - name: joint2
    mode: position
    unit: radians
  - name: joint3
    mode: position
    unit: radians
  - name: joint4
    mode: position
    unit: radians
  - name: joint5
    mode: position
    unit: radians
  - name: joint6
    mode: position
    unit: radians
  - name: gripper
    mode: position
    unit: millimeters

# 可选：当 observation.state 与动作 joints 的维度或顺序不同时单独配置。
# 未配置时默认沿用上面的 joints。
# state_joints: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]

policy:
  type: ACT
  auto_start: false
  policy_id: default

  # LeRobot 产物（含 model.safetensors）；state/action 维度分别与配置对齐
  pretrained_path: /path/to/pretrained_model
  # 默认 false；启用前应在控制开始前完成编译 warmup
  # torch_compile: true

  # Pi0.5：
  # type: pi05
  # tokenizer_path: /path/to/local-paligemma-tokenizer
  # instruction: pick up the object and place it in the box
  # inference_mode: sync  # 默认，原生 select_action chunk queue
  # 异步 LeRobot RTC：
  # inference_mode: async_rtc
  # control_hz: 50
  # rtc: { execution_horizon: 10, queue_threshold: 30 }
  # n_action_steps 由 checkpoint config 决定。

image_inputs:
  image/left: left
  image/right: right
  image/top: top
