# ACT 推理配置模板
#
#   uv run lerobot infer-once --config config/inference/act.yaml
#   uv run lerobot infer --config config/inference/act.yaml
# 完整 Dora 样例见 examples/dora_infer_act_* 和 examples/dora_sim_infer_act_7d_bin/。

joints:
  - name: joint1
    mode: position
    unit: radians
  - name: joint2
    mode: position
    unit: radians
  - name: joint3
    mode: position
    unit: radians
  - name: joint4
    mode: position
    unit: radians
  - name: joint5
    mode: position
    unit: radians
  - name: joint6
    mode: position
    unit: radians
  - name: gripper
    mode: position
    unit: millimeters

# 可选：当 observation.state 与动作 joints 的维度或顺序不同时单独配置。
# 未配置时默认沿用上面的 joints。
# state_joints: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]

policy:
  type: ACT
  auto_start: false
  policy_id: act_example

  # LeRobot 产物（含 model.safetensors）；state/action 维度分别与配置对齐。
  pretrained_path: /path/to/act/pretrained_model
  # 启用前应在控制开始前完成首次 forward warmup。
  torch_compile: false
  # null 使用标准 action chunk；设为 0.01 可启用 LeRobot temporal ensemble。
  # 启用时 runner 会按 LeRobot 要求将有效 n_action_steps 设为 1。
  temporal_ensemble_coeff: null

image_inputs:
  image/left: left
  image/right: right
  image/top: top
