# ACT 推理配置模板
#
#   uv run lerobot infer-once --config config/inference/act.yaml
#   uv run lerobot infer --config config/inference/act.yaml
# 完整 Dora 样例见 examples/dora_infer_act_* 和 examples/dora_sim_infer_act_7d_bin/。

joints:
  - name: joint1
    mode: position
    unit: radians
  - name: joint2
    mode: position
    unit: radians
  - name: joint3
    mode: position
    unit: radians
  - name: joint4
    mode: position
    unit: radians
  - name: joint5
    mode: position
    unit: radians
  - name: joint6
    mode: position
    unit: radians
  - name: gripper
    mode: position
    unit: millimeters

# 可选：当 observation.state 与动作 joints 的维度或顺序不同时单独配置。
# 未配置时默认沿用上面的 joints。
# state_joints: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]

policy:
  type: ACT
  auto_start: false
  policy_id: act_example

  # LeRobot 产物（含 model.safetensors）；state/action 维度分别与配置对齐。
  pretrained_path: /path/to/act/pretrained_model

  # sync（默认）沿用 select_action()；async_chunked 在后台运行
  # predict_action_chunk()，Dora tick 只做非阻塞 action 出队。
  # inference_mode: sync
  # 以下三项仅用于 async_chunked。
  control_hz: 30
  # 省略时使用 checkpoint 的 n_action_steps。
  # actions_per_chunk: 100
  chunk_size_threshold: 0.5

  # 启用前应在控制开始前完成首次 forward warmup。
  torch_compile: false
  # null 使用标准 action chunk；sync 下设为 0.01 可启用 LeRobot temporal ensemble。
  # temporal ensemble 不与 async_chunked 组合；启用时 runner 会按 LeRobot 要求
  # 将有效 n_action_steps 设为 1。
  temporal_ensemble_coeff: null

# 左侧可使用任意 Dora input ID；右侧 alias 与 checkpoint 图像特征匹配。
# 未匹配的 topic 会忽略；运行时未提供的 checkpoint 相机也会从 ACT 前向移除。
image_inputs:
  image/left: left
  image/right: right
  image/top: top
