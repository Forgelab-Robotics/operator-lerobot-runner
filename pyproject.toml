[project]
name = "lerobot-inference"
version = "1.0.4"
description = "Standalone inference and policy_train conversion for lerobot_trainer artifacts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 默认 PyPI 索引提供当前稳定 CUDA 13 构建；具体版本由 uv.lock 唯一固定。
    "torch",
    "torchvision",

    "lerobot[fastwam,pi,smolvla]==0.6.1",
    "transformers>=5.4.0,<5.6.0",

    "numpy==2.2.6",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "PyYAML>=6.0",
    "pillow>=10.0.0",
    "opencv-python-headless==4.13.0.92",
    "huggingface-hub>=0.20.0",
    "packaging>=24.0",
    "tqdm>=4.65.0",

    "forge-msgs==1.0.0",
    "forge-common==1.0.0",
    "forge-policy==1.0.0",
    "dora-rs==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]
libero-eval = [
    # Keep the simulator stack isolated from normal Dora/infer installations.
    "bddl==1.0.1",
    "easydict>=1.9",
    # bddl 1.0.1 still imports the compatibility helpers from PyPI's future.
    "future>=0.18.2",
    "gym==0.25.2",
    "imageio[ffmpeg]>=2.30.0,<3.0.0",
    "matplotlib>=3.5.3",
    # FastWAM's released LIBERO data/evaluation uses MuJoCo 3.3.2.
    "mujoco==3.3.2",
    # robosuite depends on the GUI build; keep its cv2 ABI aligned with the
    # project's already-pinned headless build instead of resolving OpenCV 5.
    "opencv-python==4.13.0.92",
    "robosuite==1.4.0",
]

[project.scripts]
# 统一入口：lerobot <convert|infer|infer-once|eval-libero> ...
lerobot = "lerobot_inference.cli:main"
# 兼容旧命令名（自动注入对应子命令）
lerobot-infer-once = "lerobot_inference.cli:main_infer_once"
lerobot-infer = "lerobot_inference.cli:main_infer"
lerobot-convert = "lerobot_inference.cli:main_convert"

[tool.uv.sources]
forge-msgs = { git = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge.git", tag = "forge-msgs-v1.0.0", subdirectory = "packages/msgs" }
forge-common = { git = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge.git", tag = "forge-common-v1.0.0", subdirectory = "packages/common" }
forge-policy = { git = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge.git", tag = "forge-policy-v1.0.0", subdirectory = "packages/policy" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = false

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "lerobot_inference/__init__.py"
"__main__.py" = "lerobot_inference/__main__.py"
"cli.py" = "lerobot_inference/cli.py"
"inference" = "lerobot_inference/inference"
"convert" = "lerobot_inference/convert"
"common" = "lerobot_inference/common"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
