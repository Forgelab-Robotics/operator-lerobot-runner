[project]
name = "lerobot-inference"
version = "1.0.1"
description = "Standalone inference and policy_train conversion for lerobot_trainer artifacts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",

    "nvidia-cublas-cu12>=12.8",
    "nvidia-cuda-cupti-cu12>=12.8",
    "nvidia-cuda-nvrtc-cu12>=12.8",
    "nvidia-cuda-runtime-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cufft-cu12>=11.0",
    "nvidia-curand-cu12>=10.3",
    "nvidia-cusolver-cu12>=11.0",
    "nvidia-cusparse-cu12>=12.0",
    "nvidia-npp-cu12>=12.0",
    "nvidia-nvjitlink-cu12>=12.8",
    "nvidia-nvtx-cu12>=12.8",

    "lerobot[pi,smolvla]==0.6.1",
    "transformers>=5.4.0,<5.6.0",

    "numpy>=2.0.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "PyYAML>=6.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "huggingface-hub>=0.20.0",
    "packaging>=24.0",
    "tqdm>=4.65.0",

    "forge-msgs",
    "forge-common",
    "forge-policy",
    "dora-rs==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
# 统一入口：lerobot <convert|infer|infer-once> ...
lerobot = "lerobot_inference.cli:main"
# 兼容旧命令名（自动注入对应子命令）
lerobot-infer-once = "lerobot_inference.cli:main_infer_once"
lerobot-infer = "lerobot_inference.cli:main_infer"
lerobot-convert = "lerobot_inference.cli:main_convert"

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
forge-msgs = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", rev = "dev", subdirectory = "packages/msgs" }
forge-common = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", rev = "dev", subdirectory = "packages/common" }
forge-policy = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", rev = "dev", subdirectory = "packages/policy" }
torch = { index = "pytorch-nightly-cu128" }
torchvision = { index = "pytorch-nightly-cu128" }
torchaudio = { index = "pytorch-nightly-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = false

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "lerobot_inference/__init__.py"
"__main__.py" = "lerobot_inference/__main__.py"
"cli.py" = "lerobot_inference/cli.py"
"inference" = "lerobot_inference/inference"
"convert" = "lerobot_inference/convert"
"common" = "lerobot_inference/common"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
    "torch>=2.7",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "triton>=3.0.0",
]
