name: Build Ubuntu 20.04 binary

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v1.0.5
      version:
        description: Release version without the v prefix
        required: true
        default: 1.0.5

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Install system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            libgomp1
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv and Python 3.12
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh |
            env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12
          uv --version
          uv run --no-project --python 3.12 python --version

      - name: Build with PyInstaller
        run: |
          bash scripts/setup.sh --frozen
          bash scripts/build.sh

      - name: Verify and package binary
        run: |
          test "${{ inputs.ref }}" = "v${RELEASE_VERSION}"
          test "$(./dist/lerobot_infer/lerobot_infer --version)" = "lerobot_infer ${RELEASE_VERSION}"
          ./dist/lerobot_infer/lerobot_infer --help >/dev/null
          file ./dist/lerobot_infer/lerobot_infer
          ldd --version | sed -n '1p'
          archive="forge-lerobot-inference-v${RELEASE_VERSION}-ubuntu20.04-x86_64.tar.gz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "${archive}" \
            lerobot_infer
          sha256sum "${archive}" > "${archive}.sha256"
          tar -tzf "${archive}" | grep -qx "lerobot_infer/lerobot_infer"
          sha256sum --check "${archive}.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: forge-lerobot-inference-v${{ inputs.version }}-ubuntu20.04-x86_64
          path: |
            forge-lerobot-inference-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz
            forge-lerobot-inference-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
