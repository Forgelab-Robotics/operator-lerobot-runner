# Stage 6: automatic policy start; use only after manual lifecycle validation.
nodes:
  - id: simulator
    path: ../fastwam_dora_support/project_python.sh
    args: ../fastwam_dora_support/protocol_node.py simulator --config ./simulator.yaml
    inputs:
      tick: dora/timer/millis/20
      action: policy/action
      policy_command_status: policy/policy_command_status
    outputs:
      - proprio_state
      - image/camera_0
      - image/camera_1
      - policy_command

  - id: policy
    path: ../../.venv/bin/lerobot
    args: infer --config ./policy_fastwam_auto.yaml
    inputs:
      tick: dora/timer/millis/20
      proprio_state: simulator/proprio_state
      image/camera_0: simulator/image/camera_0
      image/camera_1: simulator/image/camera_1
      policy_command: simulator/policy_command
    outputs:
      - action
      - policy_command_status
