# TaskRobot 配置（单臂 7D：右臂）
# joints 与 policy_act.yaml 一致

joints:
  - name: robot_right/joint1
    mode: position
    unit: radians
  - name: robot_right/joint2
    mode: position
    unit: radians
  - name: robot_right/joint3
    mode: position
    unit: radians
  - name: robot_right/joint4
    mode: position
    unit: radians
  - name: robot_right/joint5
    mode: position
    unit: radians
  - name: robot_right/joint6
    mode: position
    unit: radians
  - name: robot_right/gripper
    mode: prismatic
    unit: millimeters

robots:
  - id: robot_right
    joints:
      [
        "robot_right/joint1",
        "robot_right/joint2",
        "robot_right/joint3",
        "robot_right/joint4",
        "robot_right/joint5",
        "robot_right/joint6",
        "robot_right/gripper",
      ]
    actuator_order: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "gripper"]
    joint_to_actuator:
      robot_right/joint1: joint1
      robot_right/joint2: joint2
      robot_right/joint3: joint3
      robot_right/joint4: joint4
      robot_right/joint5: joint5
      robot_right/joint6: joint6
      robot_right/gripper: gripper

# image 转发：input_id -> output_id，默认相同时可写 "image/main": "image/main"
# image_forward:
#   image/left: image/left
#   image/right: image/right
#   image/top: image/top
